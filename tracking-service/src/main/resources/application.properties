spring.application.name=tracking-service

server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:h2:mem:trackingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=tracking-service-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.tracking.event

spring.kafka.consumer.properties.spring.json.value.default.type=com.example.tracking.event.ShipmentCreatedEvent

spring.kafka.consumer.properties.spring.json.use.type.headers=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true